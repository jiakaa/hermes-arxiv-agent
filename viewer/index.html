<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>博士方向论文库 | arXiv 检索与精读</title>
  <meta name="theme-color" content="#f7f5ef">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "__CF_TOKEN_PLACEHOLDER__"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>
<body>
  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <h1>博士方向论文库</h1>
        <p id="metaText">加载中...</p>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="field">
        <label for="keyword">中文 / 英文检索</label>
        <input id="keyword" type="text" placeholder="如:道路高程 / 单目深度 / 生成式仿真">
        <p class="hint">中文按词组组合匹配(「道路高程」= 同时含「道路」与「高程」)</p>
      </div>

      <div class="field">
        <label>相关性评级</label>
        <div class="chip-row" id="ratingChips">
          <button type="button" class="chip chip-all active" data-rating="">全部</button>
          <button type="button" class="chip" data-rating="S">S</button>
          <button type="button" class="chip" data-rating="A">A</button>
          <button type="button" class="chip" data-rating="B">B</button>
          <button type="button" class="chip" data-rating="C">C</button>
        </div>
      </div>

      <div class="field">
        <label>研究方向标签 <span class="hint-inline">(可多选)</span></label>
        <div class="tag-cloud" id="tagCloud"></div>
      </div>

      <div class="field">
        <label for="dateMode">日期维度</label>
        <select id="dateMode">
          <option value="crawled_date">抓取日期</option>
          <option value="published_date">发表日期</option>
        </select>
      </div>

      <div class="field">
        <label for="startDate">开始日期</label>
        <input id="startDate" type="date">
      </div>

      <div class="field">
        <label for="endDate">结束日期</label>
        <input id="endDate" type="date">
      </div>

      <div class="field">
        <label>快捷时间</label>
        <div class="quick-range" id="quickRange">
          <button type="button" class="btn" data-range="today">今天</button>
          <button type="button" class="btn" data-range="3d">3 天</button>
          <button type="button" class="btn" data-range="7d">1 周</button>
          <button type="button" class="btn" data-range="all">全部</button>
        </div>
      </div>

      <div class="field">
        <label class="switch-label">
          <input id="favoriteOnly" type="checkbox">
          <span>只看收藏</span>
        </label>
      </div>

      <div class="actions">
        <button id="resetBtn" class="btn">重置筛选</button>
      </div>
    </aside>

    <section class="main-col">
      <section class="summary" id="summary"></section>
      <section class="cards" id="cards"></section>
    </section>
  </main>

  <aside class="review-panel" id="reviewPanel" hidden>
    <div class="review-head">
      <strong id="reviewTitle">精读</strong>
      <div class="review-head-actions">
        <a id="reviewArxivLink" target="_blank" rel="noopener noreferrer" class="btn">arXiv 原文</a>
        <button id="reviewCloseBtn" class="btn" type="button">关闭</button>
      </div>
    </div>
    <div class="review-body" id="reviewBody"></div>
  </aside>

  <template id="paperTpl">
    <article class="card">
      <!-- 第一层:与标题无关的元信息(编号 / 评级 / 收藏) -->
      <div class="card-top">
        <span class="pill"></span>
        <span class="rating-badge"></span>
        <button class="favorite-btn" type="button" aria-label="收藏">☆ 收藏</button>
      </div>
      <!-- 第二层:标题独占整行,从左边缘开始 -->
      <a class="title" target="_blank" rel="noopener noreferrer"></a>
      <div class="meta"></div>
      <div class="tags"></div>
      <div class="section">
        <h3>中文总结</h3>
        <p class="summary-cn"></p>
      </div>
      <details>
        <summary>查看 Abstract</summary>
        <p class="abstract"></p>
      </details>
      <div class="card-actions">
        <button class="btn btn-primary review-btn" type="button">精读</button>
      </div>
    </article>
  </template>

  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/auto-render.min.js"></script>
  <script src="search.js"></script>
  <script src="markdown.js"></script>
  <script src="review.js"></script>
  <script src="app.js"></script>
</body>
</html>
